name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    uses: Wiltzsu/platform/.github/workflows/reusable-deploy-laravel.yml@master
    with:
      deploy_path: /var/www/avantotracker-api
      php_version: "8.4"
      node_version: "20"
      run_migrations: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
